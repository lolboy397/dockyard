    <div class="field">
      @if (label) {
        <label class="field-label">
          <span>{{ label }}</span>
          @if (optional) { <span class="opt">optional</span> }
        </label>
      }
      <ng-content></ng-content>
      @if (error) {
        <span class="field-error"><dy-icon name="circle-alert" [size]="12"></dy-icon> {{ error }}</span>
      } @else if (hint) {
        <span class="field-hint">{{ hint }}</span>
      }
    </div>
