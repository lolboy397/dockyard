    <div style="margin-top:6px;">
      <div class="pw-meter">
        @for (i of [1, 2, 3, 4]; track i) {
          <span class="pw-seg" [style.background]="i <= score ? lvl.color : 'var(--ink-4)'"></span>
        }
      </div>
      @if (value) {
        <div style="display:flex;justify-content:space-between;margin-top:6px;">
          <span class="pw-label" [style.color]="lvl.color">{{ lvl.label }}</span>
        </div>
      }
    </div>
