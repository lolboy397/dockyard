    @if (visible) {
      <app-modal [title]="config.title" size="sm" (close)="respond(false)">

        @if (config.message) {
          <p style="margin:0;font-size:13px;color:var(--fg-muted);line-height:1.55;">
            {{ config.message }}
          </p>
        }

        @if (config.items?.length) {
          <div style="margin-top:10px;max-height:160px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;background:var(--bg-sunken,var(--bg-1));padding:4px 0;">
            @for (item of config.items; track item) {
              <div style="display:flex;justify-content:space-between;gap:16px;padding:3px 10px;font-size:11px;font-family:var(--font-mono,monospace);color:var(--fg-muted);">
                <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ item.split('···')[0] }}</span>
                @if (item.includes('···')) {
                  <span style="flex-shrink:0;color:var(--fg-subtle);">{{ item.split('···')[1] }}</span>
                }
              </div>
            }
          </div>
        }

        @if (isCheckbox && checkboxConfig) {
          <label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--fg-muted);cursor:pointer;user-select:none;">
            <input type="checkbox" [(ngModel)]="checkboxChecked"
                   style="accent-color:var(--danger-400,#F87171);width:14px;height:14px;cursor:pointer;flex-shrink:0;">
            {{ checkboxConfig.checkboxLabel }}
          </label>
        }

        <div modal-footer>
          <button class="btn btn-sm btn-ghost" (click)="respond(false)">Cancel</button>
          <button
            [class]="'btn btn-sm ' + (config.danger ? 'btn-danger' : 'btn-primary')"
            (click)="respond(true)">
            {{ config.confirmLabel || 'Confirm' }}
          </button>
        </div>

      </app-modal>
    }
