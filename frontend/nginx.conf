# ── Dockyard application server (HTTP + HTTPS) ────────────────────────────────
# Served on both :80 and :443 with NO forced HTTP→HTTPS redirect. For a local
# instance the recommended URL is http://localhost — browsers treat localhost as
# a secure context, so it shows no "Not secure" warning and needs no certificate.
# HTTPS is still available (self-signed by default) for when the app is placed
# behind a real reverse proxy / certificate; mount real certs over
# /etc/nginx/certs (fullchain.pem + privkey.pem) and add HSTS there.
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Certificates: a self-signed pair is baked into the image as a default and
    # only applies to the :443 listener.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers. add_header is inherited by the location blocks below
    # because none of them declare their own add_header directives.
    #
    # HSTS is intentionally NOT sent: the default image ships a self-signed cert
    # and is meant to be reached over http://localhost, so forcing HTTPS would
    # only reintroduce the certificate warning. Add Strict-Transport-Security
    # when deploying behind a real certificate (see ROADMAP "Real TLS / wss://").
    add_header X-Frame-Options        "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 512m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # Proxy WebSocket connections to backend
    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        # Forward the FULL Host incl. port ($http_host, not $host) — the backend's
        # same-origin WebSocket check compares the Origin (which carries the port,
        # e.g. host:9272) against this Host; $host would drop the port and reject
        # the upgrade on any non-default port.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        # The session token is passed as ?token= on WS URLs; don't write it to
        # the access log in cleartext. The backend logs WS connects (redacted).
        access_log off;
    }

    # Proxy hosted Git smart HTTP traffic to backend
    location /git/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 500m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # Public CI deploy webhooks → backend (token-authenticated by the app)
    location /webhooks/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — serve index.html for all unmatched paths
    location / {
        try_files $uri $uri/ /index.html;
    }
}
