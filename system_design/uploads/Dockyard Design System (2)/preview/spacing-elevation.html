<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Elevation</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 24px; background: var(--bg); display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .card { width: 96px; height: 64px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--r-md); }
  .name { font-family: var(--font-mono); font-size: 10px; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--fg-muted); }
  .val { font-family: var(--font-mono); font-size: 10px; color: var(--fg-subtle); text-align: center; }
</style>
</head>
<body>
  <div class="item"><div class="card" style="box-shadow: var(--sh-1)"></div><span class="name">sh-1</span><span class="val">cards</span></div>
  <div class="item"><div class="card" style="box-shadow: var(--sh-2)"></div><span class="name">sh-2</span><span class="val">menus</span></div>
  <div class="item"><div class="card" style="box-shadow: var(--sh-3)"></div><span class="name">sh-3</span><span class="val">modals</span></div>
  <div class="item"><div class="card" style="box-shadow: var(--sh-4)"></div><span class="name">sh-4</span><span class="val">palette</span></div>
  <div class="item"><div class="card" style="box-shadow: var(--sh-glow); border-color: var(--accent)"></div><span class="name">glow</span><span class="val">focus / live</span></div>
</body>
</html>
