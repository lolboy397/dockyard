<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 22px; background: var(--bg); display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 7px; font: 500 13px/1 var(--font-sans); border: 1px solid transparent; cursor: pointer; transition: all 120ms var(--ease-out); }
  .btn .ic { width: 14px; height: 14px; flex: none; }
  .primary { background: var(--accent); color: var(--fg-on-brand); }
  .primary:hover { background: var(--accent-hover); }
  .secondary { background: var(--bg-raised); color: var(--fg); border-color: var(--border); }
  .secondary:hover { background: var(--bg-hover); border-color: var(--border-strong); }
  .ghost { background: transparent; color: var(--fg-muted); }
  .ghost:hover { background: var(--bg-hover); color: var(--fg); }
  .danger { background: var(--bg-raised); color: var(--danger-400); border-color: var(--border); }
  .danger:hover { background: rgba(239,68,68,0.10); border-color: var(--danger-500); }
  .icon-btn { width: 32px; padding: 0; justify-content: center; background: var(--bg-raised); border-color: var(--border); color: var(--fg-muted); }
  .icon-btn:hover { background: var(--bg-hover); color: var(--fg); }
  .lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--fg-subtle); width: 90px; }
  .small { height: 26px; padding: 0 10px; font-size: 12px; }
</style>
</head>
<body>
  <div class="row">
    <span class="lbl">Primary</span>
    <button class="btn primary">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="6 4 20 12 6 20"></polygon></svg>
      Start container
    </button>
    <button class="btn primary">Deploy</button>
    <button class="btn primary small">Apply</button>
  </div>
  <div class="row">
    <span class="lbl">Secondary</span>
    <button class="btn secondary">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"></path><polyline points="21 3 21 8 16 8"></polyline></svg>
      Restart
    </button>
    <button class="btn secondary">Open shell</button>
    <button class="btn secondary">Cancel</button>
  </div>
  <div class="row">
    <span class="lbl">Ghost · Icon</span>
    <button class="btn ghost">Show logs</button>
    <button class="btn icon-btn"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
    <button class="btn icon-btn"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h6v6H4z"/><path d="M14 4h6v6h-6z"/><path d="M4 14h6v6H4z"/><path d="M14 14h6v6h-6z"/></svg></button>
    <span class="lbl" style="width:auto">Danger</span>
    <button class="btn danger">Force remove</button>
  </div>
</body>
</html>
