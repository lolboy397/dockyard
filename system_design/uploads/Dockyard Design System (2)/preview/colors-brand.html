<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Brand colors</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 16px; background: var(--bg); display: flex; gap: 10px; align-items: stretch; }
  .sw { flex: 1; border-radius: var(--r-md); padding: 10px 10px 12px; display: flex; flex-direction: column; justify-content: space-between; min-height: 96px; border: 1px solid var(--border-subtle); }
  .sw .name { font-family: var(--font-mono); font-size: 10px; letter-spacing: var(--tracking-caps); text-transform: uppercase; }
  .sw .hex { font-family: var(--font-mono); font-size: 11px; }
  .light { color: #04181D; }
  .dark { color: rgba(255,255,255,0.85); }
</style>
</head>
<body>
  <div class="sw light" style="background:#E6FCFF"><span class="name">50</span><span class="hex">#E6FCFF</span></div>
  <div class="sw light" style="background:#BCF6FF"><span class="name">100</span><span class="hex">#BCF6FF</span></div>
  <div class="sw light" style="background:#7CEBFC"><span class="name">200</span><span class="hex">#7CEBFC</span></div>
  <div class="sw light" style="background:#3DDCF2"><span class="name">300</span><span class="hex">#3DDCF2</span></div>
  <div class="sw light" style="background:#22D3EE; outline: 1px solid rgba(34,211,238,0.4); outline-offset: -1px"><span class="name">400 ●</span><span class="hex">#22D3EE</span></div>
  <div class="sw light" style="background:#06B6D4"><span class="name">500</span><span class="hex">#06B6D4</span></div>
  <div class="sw dark" style="background:#0891B2"><span class="name">600</span><span class="hex">#0891B2</span></div>
  <div class="sw dark" style="background:#0E7490"><span class="name">700</span><span class="hex">#0E7490</span></div>
  <div class="sw dark" style="background:#155E75"><span class="name">800</span><span class="hex">#155E75</span></div>
  <div class="sw dark" style="background:#164E63"><span class="name">900</span><span class="hex">#164E63</span></div>
</body>
</html>
