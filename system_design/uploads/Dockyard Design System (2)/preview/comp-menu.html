<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Menu & palette</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 16px; background: var(--bg); display: grid; grid-template-columns: 220px 1fr; gap: 16px; align-items: start; }
  /* Context menu */
  .menu { background: var(--bg-raised); border: 1px solid var(--border-strong); border-radius: var(--r-md); padding: 4px; box-shadow: var(--sh-3); width: 220px; }
  .mi { display: flex; align-items: center; gap: 10px; padding: 6px 10px; font-size: 13px; color: var(--fg-default); border-radius: 5px; cursor: pointer; }
  .mi:hover { background: var(--bg-hover); color: var(--fg); }
  .mi .ic { width: 14px; height: 14px; color: var(--fg-muted); }
  .mi .k { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--fg-subtle); }
  .mi.danger { color: var(--danger-400); }
  .mi.danger .ic { color: var(--danger-400); }
  .sep { height: 1px; background: var(--border-subtle); margin: 4px 6px; }

  /* Command palette */
  .palette { background: rgba(15,20,31,0.92); backdrop-filter: blur(12px); border: 1px solid var(--border-strong); border-radius: var(--r-xl); box-shadow: var(--sh-4); overflow: hidden; }
  .psearch { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .psearch input { background: transparent; border: 0; outline: 0; flex: 1; color: var(--fg); font: 400 14px/1 var(--font-sans); }
  .psearch .ic { width: 16px; height: 16px; color: var(--fg-muted); }
  .plist { padding: 6px; max-height: 220px; }
  .prow { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 6px; font-size: 13px; color: var(--fg-default); }
  .prow.on { background: var(--accent-soft); color: var(--fg); }
  .prow .ic { width: 14px; height: 14px; color: var(--fg-muted); }
  .prow.on .ic { color: var(--accent); }
  .prow .k { margin-left: auto; font-family: var(--font-mono); font-size: 10px; color: var(--fg-subtle); }
  .prow .scope { font-family: var(--font-mono); font-size: 10px; color: var(--fg-subtle); padding: 1px 6px; background: var(--bg-raised); border-radius: 3px; }
</style>
</head>
<body>
  <div class="menu">
    <div class="mi"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="6 4 20 12 6 20"/></svg> Start<span class="k">⌘↵</span></div>
    <div class="mi"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><polyline points="21 3 21 8 16 8"/></svg> Restart<span class="k">⌘R</span></div>
    <div class="mi"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg> Open shell<span class="k">⌘T</span></div>
    <div class="mi"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> View logs</div>
    <div class="sep"></div>
    <div class="mi danger"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg> Force remove<span class="k">⌫</span></div>
  </div>

  <div class="palette">
    <div class="psearch">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input value="start ng" placeholder="Type a command…"/>
      <span class="k mono" style="font-size:10px; color:var(--fg-subtle)">esc</span>
    </div>
    <div class="plist">
      <div class="prow on">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="6 4 20 12 6 20"/></svg>
        Start <span style="font-weight:500">nginx-prod</span>
        <span class="scope">container</span>
        <span class="k">⌘↵</span>
      </div>
      <div class="prow">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="6 4 20 12 6 20"/></svg>
        Start <span style="font-weight:500">nginx-staging</span>
        <span class="scope">container</span>
      </div>
      <div class="prow">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 22 8 12 14 2 8"/></svg>
        Pull <span style="font-weight:500">nginx:1.27</span>
        <span class="scope">image</span>
      </div>
    </div>
  </div>
</body>
</html>
