<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Logo</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 24px; background: var(--bg); display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; align-items: stretch; }
  .item { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--r-md); padding: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; min-height: 140px; }
  .item.light { background: var(--ink-11); }
  .lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--fg-muted); }
  .item.light .lbl { color: var(--ink-7); }
  /* light variant of mark */
  .ink-mark { width: 48px; height: 48px; }
</style>
</head>
<body>
  <div class="item">
    <img src="../assets/logo-wordmark.svg" alt="Dockyard wordmark" height="32"/>
    <span class="lbl">wordmark · primary</span>
  </div>
  <div class="item">
    <img src="../assets/logo-mark.svg" alt="Dockyard mark" width="56" height="56"/>
    <span class="lbl">mark · cyan on ink</span>
  </div>
  <div class="item light">
    <svg class="ink-mark" viewBox="0 0 24 24">
      <rect x="2" y="4" width="20" height="16" rx="3" fill="#0A0E17"/>
      <rect x="6" y="9" width="3" height="3" rx="0.5" fill="#22D3EE"/>
      <rect x="10.5" y="9" width="3" height="3" rx="0.5" fill="#22D3EE"/>
      <rect x="15" y="9" width="3" height="3" rx="0.5" fill="#22D3EE"/>
      <rect x="6" y="13.5" width="3" height="3" rx="0.5" fill="#22D3EE"/>
      <rect x="10.5" y="13.5" width="3" height="3" rx="0.5" fill="#22D3EE"/>
    </svg>
    <span class="lbl">mark · ink on light</span>
  </div>
</body>
</html>
