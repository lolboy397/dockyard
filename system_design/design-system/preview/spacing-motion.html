<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Motion</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 20px; background: var(--bg); display: flex; flex-direction: column; gap: 14px; }
  .row { display: grid; grid-template-columns: 120px 1fr 110px; gap: 14px; align-items: center; }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--fg); }
  .desc { font-family: var(--font-mono); font-size: 10px; color: var(--fg-subtle); text-align: right; }
  .track { position: relative; height: 14px; background: var(--bg-elevated); border-radius: 999px; border: 1px solid var(--border-subtle); overflow: hidden; }
  .dot { position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 999px; background: var(--accent); animation-duration: 1.8s; animation-iteration-count: infinite; animation-direction: alternate; }
  .d1 .dot { animation-name: slide; animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
  .d2 .dot { animation-name: slide; animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1); }
  .d3 .dot { animation-name: slide; animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
  .d4 .dot { animation-name: slide; animation-timing-function: linear; }
  @keyframes slide { from { left: 2px; } to { left: calc(100% - 12px); } }
</style>
</head>
<body>
  <div class="row d1"><span class="name">ease-out</span><div class="track"><span class="dot"></span></div><span class="desc">default UI</span></div>
  <div class="row d2"><span class="name">ease-in-out</span><div class="track"><span class="dot"></span></div><span class="desc">modals</span></div>
  <div class="row d3"><span class="name">spring</span><div class="track"><span class="dot"></span></div><span class="desc">toggles only</span></div>
  <div class="row d4"><span class="name">linear</span><div class="track"><span class="dot"></span></div><span class="desc">progress</span></div>
</body>
</html>
