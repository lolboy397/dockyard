<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 20px; background: var(--bg); display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .swatch { width: 64px; height: 64px; background: var(--bg-elevated); border: 1px solid var(--border); }
  .name { font-family: var(--font-mono); font-size: 10px; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--fg-muted); }
  .val { font-family: var(--font-mono); font-size: 10px; color: var(--fg-subtle); }
</style>
</head>
<body>
  <div class="item"><div class="swatch" style="border-radius:3px"></div><span class="name">xs</span><span class="val">3</span></div>
  <div class="item"><div class="swatch" style="border-radius:5px"></div><span class="name">sm</span><span class="val">5</span></div>
  <div class="item"><div class="swatch" style="border-radius:7px"></div><span class="name">md</span><span class="val">7</span></div>
  <div class="item"><div class="swatch" style="border-radius:10px"></div><span class="name">lg</span><span class="val">10</span></div>
  <div class="item"><div class="swatch" style="border-radius:14px"></div><span class="name">xl</span><span class="val">14</span></div>
  <div class="item"><div class="swatch" style="border-radius:20px"></div><span class="name">2xl</span><span class="val">20</span></div>
  <div class="item"><div class="swatch" style="border-radius:999px"></div><span class="name">full</span><span class="val">pill</span></div>
</body>
</html>
