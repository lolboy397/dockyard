<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Container row</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 16px; background: var(--bg); }
  .table { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; }
  .head, .row { display: grid; grid-template-columns: 28px 1.6fr 1.2fr 110px 90px 1fr 36px; align-items: center; gap: 12px; padding: 0 14px; height: 36px; font-size: 12px; }
  .head { background: var(--bg-raised); color: var(--fg-muted); font-family: var(--font-mono); font-size: 10px; letter-spacing: var(--tracking-caps); text-transform: uppercase; border-bottom: 1px solid var(--border); }
  .row { border-bottom: 1px solid var(--border-subtle); color: var(--fg-default); height: 40px; }
  .row:last-child { border-bottom: 0; }
  .row.sel { background: rgba(34,211,238,0.06); box-shadow: inset 3px 0 0 var(--accent); }
  .row:hover:not(.sel) { background: var(--bg-hover); }
  .check { width: 14px; height: 14px; border: 1.5px solid var(--border-strong); border-radius: 3px; }
  .sel .check { background: var(--accent); border-color: var(--accent); position: relative; }
  .sel .check::after { content: ''; position: absolute; left: 3px; top: 1px; width: 4px; height: 7px; border: solid var(--fg-on-brand); border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .name { font-weight: 500; color: var(--fg); }
  .id { font-family: var(--font-mono); font-size: 11px; color: var(--fg-subtle); margin-left: 6px; }
  .img { font-family: var(--font-mono); font-size: 11px; color: var(--fg-muted); }
  .port { font-family: var(--font-mono); font-size: 11px; color: var(--fg-muted); }
  .time { font-family: var(--font-mono); font-size: 11px; color: var(--fg-subtle); }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 7px; border-radius: 3px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 500; }
  .dot { width: 6px; height: 6px; border-radius: 999px; }
  .more { color: var(--fg-muted); }
</style>
</head>
<body>
<div class="table">
  <div class="head">
    <span></span>
    <span>Name</span>
    <span>Image</span>
    <span>Status</span>
    <span>Ports</span>
    <span>Started</span>
    <span></span>
  </div>
  <div class="row sel">
    <span class="check"></span>
    <span><span class="name">nginx-prod</span><span class="id">a1b2c3d</span></span>
    <span class="img">nginx:1.27.0</span>
    <span><span class="badge" style="background:rgba(16,185,129,0.12); color:#34D399"><span class="dot" style="background:#34D399"></span>Running</span></span>
    <span class="port">:8080→80</span>
    <span class="time">3m ago</span>
    <span class="more">⋯</span>
  </div>
  <div class="row">
    <span class="check"></span>
    <span><span class="name">postgres-main</span><span class="id">e4f5g6h</span></span>
    <span class="img">postgres:16.2</span>
    <span><span class="badge" style="background:rgba(16,185,129,0.12); color:#34D399"><span class="dot" style="background:#34D399"></span>Running</span></span>
    <span class="port">:5432→5432</span>
    <span class="time">2h ago</span>
    <span class="more">⋯</span>
  </div>
  <div class="row">
    <span class="check"></span>
    <span><span class="name">worker-jobs</span><span class="id">i7j8k9l</span></span>
    <span class="img">internal/worker:42</span>
    <span><span class="badge" style="background:rgba(245,158,11,0.12); color:#FBBF24"><span class="dot" style="background:#FBBF24"></span>Restarting</span></span>
    <span class="port">—</span>
    <span class="time">12s ago</span>
    <span class="more">⋯</span>
  </div>
  <div class="row">
    <span class="check"></span>
    <span><span class="name">cache</span><span class="id">m0n1o2p</span></span>
    <span class="img">redis:7.2-alpine</span>
    <span><span class="badge" style="background:rgba(148,163,184,0.10); color:#94A3B8"><span class="dot" style="background:#94A3B8"></span>Exited</span></span>
    <span class="port">—</span>
    <span class="time">1d ago</span>
    <span class="more">⋯</span>
  </div>
</div>
</body>
</html>
