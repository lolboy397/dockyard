name: Build & publish images

# Builds the two Dockyard application images (backend + frontend) and pushes them
# to the GitHub Container Registry (GHCR) so a server can run the stack from
# pre-built images instead of building locally:
#
#   docker compose pull && docker compose up -d
#
# Triggers:
#   - push to main         → :latest  (+ :sha-<short>)
#   - push of a v* tag     → :<version>  (e.g. v0.0.1 → :0.0.1, :0.0)
#   - manual (Run workflow) → builds the selected ref
#
# The registry/socket-proxy services in docker-compose.yml come from Docker Hub
# and are not built here.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: ${{ matrix.component }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./backend
            image: dockyard-backend
          - component: frontend
            context: ./frontend
            image: dockyard-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          # `latest` only on the default branch; full semver on v* tags; a short
          # SHA tag on every build for precise pinning / rollback.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse layers between runs, scoped per image so they don't collide.
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          # Single linux/amd64 image (no provenance attestation) keeps the package
          # a plain image. If the target server is ARM, add:
          #   platforms: linux/arm64
          provenance: false
